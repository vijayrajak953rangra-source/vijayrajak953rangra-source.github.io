<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zone Rush 3D</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#9ad0f5">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#9ad0f5;--fg:#1d1d1f;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#26272d;--fg:#f1f1f1}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;touch-action:none;user-select:none;overflow:hidden}
#hud{position:absolute;z-index:2;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;justify-content:space-between;padding:12px 18px;font-weight:800;color:#12263a;text-shadow:0 1px 0 rgba(255,255,255,.6);pointer-events:none}
#wrap{position:relative;flex:1;min-height:0}
canvas{display:block}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:3}
#card{background:var(--card);color:var(--fg);padding:24px 28px;border-radius:16px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.3);max-width:260px}
#card h1{margin:0 0 6px;font-size:28px}
#card p{margin:6px 0 16px;opacity:.75;font-size:14px}
button{background:#2f80ed;color:#fff;border:0;border-radius:10px;padding:12px 28px;font-size:17px;font-weight:700}
#sw{margin:4px 0 14px}
.sw{display:inline-block;width:30px;height:30px;border-radius:50%;margin:0 4px;border:3px solid transparent;box-sizing:border-box}
.sw.on{border-color:var(--fg);transform:scale(1.15)}
#snd{background:transparent;color:var(--fg);padding:8px 12px;font-size:14px;margin-top:10px;opacity:.7}
#intro{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,rgba(18,38,58,.5),rgba(10,20,34,.88));color:#fff;text-align:center;overflow:hidden}
.logo{position:relative;z-index:1;font-weight:900;font-size:clamp(44px,15vw,88px);line-height:.95;letter-spacing:2px;text-shadow:0 1px 0 #1b5fc4,0 2px 0 #1b5fc4,0 3px 0 #1b5fc4,0 4px 0 #174a99,0 5px 0 #174a99,0 12px 18px rgba(0,0,0,.5)}
.logo span{display:block;opacity:0;animation:drop .7s cubic-bezier(.2,1.4,.4,1) forwards}
.logo span:nth-child(2){animation-delay:.25s;color:#ffd54f}
.logo b{display:inline-block;margin-top:10px;padding:2px 20px;background:#eb5757;border-radius:12px;font-size:.55em;text-shadow:none;opacity:0;animation:drop .7s .55s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes drop{from{opacity:0;transform:translateY(-90px) scale(1.3) rotate(-6deg)}to{opacity:1;transform:none}}
#intro p{position:relative;z-index:1;margin-top:30px;font-weight:700;opacity:0;animation:pulse 1.2s 1.3s infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.fc{position:absolute;top:-40px;width:26px;height:26px;border-radius:5px;opacity:.8;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
</style>
</head>
<body>
<div id="hud"><span>Zone: <b id="sc">0%</b></span><span>Best: <b id="bs">0%</b></span></div>
<div id="wrap">
<div id="intro"><div class="logo"><span>ZONE</span><span>RUSH</span><b>3D</b></div><p>Tap to start</p></div>
<div id="ov" style="display:none"><div id="card"><h1 id="t">Zone Rush 3D</h1><p id="m">Swipe ya arrow keys se chalo. Apni zameen se bahar nikalo, loop band karke area capture karo. Trail kat gayi toh out!</p><div id="sw"></div><button id="go">Play</button><br><button id="snd">🔊 Sound: On</button></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const N=64,TICK=120,COLORS=['#2f80ed','#eb5757','#27ae60','#f2994a','#9b51e0'];
const wrap=document.getElementById('wrap'),sc=document.getElementById('sc'),bs=document.getElementById('bs'),ov=document.getElementById('ov');
let own,trl,ents,running=false,best=0,timer,lastTick=0;
try{best=+localStorage.getItem('zrBest')||0}catch(e){}
bs.textContent=best+'%';
if(typeof THREE==='undefined'){document.getElementById('m').textContent='3D engine load nahi hua. Internet check karo.'}
const idx=(x,y)=>y*N+x;
let RAD=N/2-.3;
const inC=(x,y)=>x>=0&&y>=0&&x<N&&y<N&&(Math.max(Math.abs(x+.5-N/2)-.5,0)**2+Math.max(Math.abs(y+.5-N/2)-.5,0)**2<=RAD*RAD);
let CA=0;for(let i=0;i<N*N;i++)if(inC(i%N,(i/N)|0))CA++;
/* ---------- sound ---------- */
let actx,soundOn=true,t0=0,bestAtStart=0;
function sfx(f,d=.1,type='sine',vol=.15,slide=0){
  if(!soundOn||!actx)return;
  const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;
  o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(actx.destination);o.start();o.stop(t+d);
}
document.getElementById('snd').onclick=function(){soundOn=!soundOn;this.textContent=soundOn?'🔊 Sound: On':'🔇 Sound: Off'};
/* ---------- skins ---------- */
const SKINS=['#2f80ed','#e91e8c','#00bcd4','#f1c40f','#9b51e0'];
let skin=0;try{skin=+localStorage.getItem('zrSkin')||0}catch(e){}
const swEl=document.getElementById('sw');
SKINS.forEach((c,i)=>{const b=document.createElement('span');b.className='sw';b.style.background=c;b.onclick=()=>{skin=i;try{localStorage.setItem('zrSkin',i)}catch(e){}applySkin();sfx(600,.06,'triangle',.1)};swEl.appendChild(b)});
function applySkin(){COLORS[0]=SKINS[skin];heads[0].children[0].material.color.set(COLORS[0]);[...swEl.children].forEach((b,i)=>b.classList.toggle('on',i===skin));setHat(heads[0],skin,0xffd54f)}
/* ---------- 3D scene ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
wrap.insertBefore(renderer.domElement,ov);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9ad0f5);
scene.fog=new THREE.Fog(0x9ad0f5,24,60);
const camera=new THREE.PerspectiveCamera(55,1,0.1,200);
scene.add(new THREE.AmbientLight(0xffffff,.65));
const sun=new THREE.DirectionalLight(0xffffff,.8);sun.position.set(8,20,6);scene.add(sun);
const outer=new THREE.Mesh(new THREE.PlaneGeometry(400,400),new THREE.MeshLambertMaterial({color:0x6bbf59}));
outer.rotation.x=-Math.PI/2;outer.position.y=-.3;scene.add(outer);
const board=new THREE.Mesh(new THREE.BoxGeometry(N,.3,N),new THREE.MeshLambertMaterial({color:0xe6e3d8}));
board.position.y=-.15;scene.add(board);
const grid=new THREE.GridHelper(N,N,0xcfcbbd,0xcfcbbd);grid.position.y=.01;scene.add(grid);
const cells=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshLambertMaterial({color:0xffffff}),N*N);
cells.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(cells);
const heads=[];
for(let k=0;k<4;k++){
  const g=new THREE.Group();
  const b=new THREE.Mesh(new THREE.BoxGeometry(.8,.9,.8),new THREE.MeshLambertMaterial({color:COLORS[k]}));b.position.y=.45;g.add(b);
  const em=new THREE.MeshBasicMaterial({color:0xffffff});
  for(const s of[-1,1]){const e=new THREE.Mesh(new THREE.SphereGeometry(.1,8,8),em);e.position.set(s*.2,.62,.38);g.add(e)}
  g.visible=false;scene.add(g);heads.push(g);
}
/* ---------- environment ---------- */
const envStart=scene.children.length;
const R=(a,b)=>a+Math.random()*(b-a);
const lamb=c=>new THREE.MeshLambertMaterial({color:c});
const boxG=new THREE.BoxGeometry(1,1,1),trunkG=new THREE.CylinderGeometry(.18,.25,1,6),leafG=new THREE.ConeGeometry(.9,1.8,7),rockG=new THREE.DodecahedronGeometry(.6);
const trunkM=lamb(0x7a5230),leafMs=[lamb(0x2e9e4f),lamb(0x3fb860),lamb(0x1f7d3f)],rockM=lamb(0x8a8f98);
function outPos(min,max){const a=min-N/2,b=max-N/2,r0=RAD+a,r1=RAD+b;for(;;){const x=R(-r1,r1),z=R(-r1,r1);if(Math.hypot(x,z)>r0)return[x,z]}}
for(let i=0;i<70;i++){const[x,z]=outPos(N/2+2,N/2+26),s=R(.8,1.8);
  const t=new THREE.Mesh(trunkG,trunkM);t.scale.set(s,s*1.2,s);t.position.set(x,.6*s,z);scene.add(t);
  const l=new THREE.Mesh(leafG,leafMs[i%3]);l.scale.set(s,s,s);l.position.set(x,2.1*s,z);scene.add(l)}
for(let i=0;i<30;i++){const[x,z]=outPos(N/2+2,N/2+24),s=R(.5,1.6),r=new THREE.Mesh(rockG,rockM);r.scale.set(s,s*.8,s);r.position.set(x,.3*s,z);r.rotation.set(R(0,3),R(0,3),0);scene.add(r)}
const BP=[0x5b6b8c,0xc9785d,0x7d5ba6,0x4aa3a3,0xe0b04a];
for(let i=0;i<26;i++){const a=i/26*Math.PI*2+R(-.1,.1),d=R(N/2+16,N/2+34),w=R(3,6),h=R(6,20);
  const b=new THREE.Mesh(boxG,lamb(BP[i%5]));b.scale.set(w,h,w);b.position.set(Math.cos(a)*d,h/2,Math.sin(a)*d);scene.add(b);
  const rf=new THREE.Mesh(boxG,lamb(0x2d3440));rf.scale.set(w*1.1,.6,w*1.1);rf.position.set(b.position.x,h+.3,b.position.z);scene.add(rf)}
const PILM=lamb(0x39424e),CAPM=lamb(0xffd54f);
for(let k=0;k<=N;k+=4)for(const[px,pz]of[[k-N/2,-N/2],[k-N/2,N/2],[-N/2,k-N/2],[N/2,k-N/2]]){
  const p=new THREE.Mesh(boxG,PILM);p.scale.set(.6,1.2,.6);p.position.set(px,.6,pz);scene.add(p);
  const c=new THREE.Mesh(boxG,CAPM);c.scale.set(.75,.2,.75);c.position.set(px,1.3,pz);scene.add(c)}
const floaters=[],clouds=[],FC=[0xff6b6b,0x4dd0e1,0xffd54f,0xba68c8,0x81c784];
for(let i=0;i<16;i++){const[x,z]=outPos(N/2+1,N/2+22),s=R(.8,2),m=new THREE.Mesh(boxG,lamb(FC[i%5]));m.scale.set(s,s,s);m.position.set(x,R(5,14),z);scene.add(m);floaters.push({m,by:m.position.y,ph:R(0,6)})}
const CM=new THREE.MeshLambertMaterial({color:0xffffff,transparent:true,opacity:.92});
for(let i=0;i<9;i++){const g=new THREE.Group();for(let j=0;j<4;j++){const b=new THREE.Mesh(boxG,CM);b.scale.set(R(3,6),R(1.2,2),R(2,4));b.position.set(j*2.5-4,R(-.4,.4),R(-1,1));g.add(b)}g.position.set(R(-50,50),R(14,22),R(-50,20));scene.add(g);clouds.push(g)}
function animEnv(now){for(const f of floaters){f.m.rotation.y+=.012;f.m.rotation.x+=.006;f.m.position.y=f.by+Math.sin(now/900+f.ph)*.6}for(const c of clouds){c.position.x+=.012;if(c.position.x>60)c.position.x=-60}}
function setHat(g,type,col){
  if(g.userData.hat)g.remove(g.userData.hat);
  const h=new THREE.Group(),m=lamb(col),add=(geo,mat,x,y,z,rz)=>{const o=new THREE.Mesh(geo,mat);o.position.set(x,y,z);if(rz)o.rotation.z=rz;h.add(o);return o};
  if(type===1){add(boxG,m,0,1.1,0).scale.set(.06,.4,.06);add(new THREE.SphereGeometry(.13,8,8),lamb(0xff4d4d),0,1.35,0)}
  if(type===2)add(new THREE.ConeGeometry(.3,.6,8),lamb(0xff4d4d),0,1.2,0);
  if(type===3){add(boxG,m,0,.98,0).scale.set(.7,.15,.7);for(const[x,z]of[[-.28,-.28],[.28,-.28],[-.28,.28],[.28,.28]])add(boxG,m,x,1.12,z).scale.set(.12,.2,.12)}
  if(type===4){add(new THREE.ConeGeometry(.1,.45,6),lamb(0xffffff),-.28,1.1,0,.4);add(new THREE.ConeGeometry(.1,.45,6),lamb(0xffffff),.28,1.1,0,-.4)}
  g.add(h);g.userData.hat=h;
}
setHat(heads[1],4,0xffffff);setHat(heads[2],2,0);setHat(heads[3],1,0xffffff);
scene.children.slice(envStart).forEach(o=>scene.remove(o));floaters.length=0;clouds.length=0;
function resize(){const w=wrap.clientWidth,h=wrap.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}
addEventListener('resize',resize);
const M=new THREE.Matrix4(),Q=new THREE.Quaternion(),V=new THREE.Vector3(),SC=new THREE.Vector3(),CL=new THREE.Color();
function refresh(){
  for(let i=0;i<N*N;i++){
    const x=i%N,y=(i/N)|0;
    const t=trl[i],o=own[i];
    if(t||o){
      const h=t?.6:.3;
      V.set(x-N/2+.5,h/2,y-N/2+.5);SC.set(.98,h,.98);
      CL.set(COLORS[(t||o)-1]);if(!t)CL.lerp(new THREE.Color(0xffffff),.3);
    }else{V.set(0,-5,0);SC.set(0,0,0);CL.set(0)}
    M.compose(V,Q,SC);cells.setMatrixAt(i,M);cells.setColorAt(i,CL);
  }
  cells.instanceMatrix.needsUpdate=true;cells.instanceColor.needsUpdate=true;
}
/* ---------- game logic ---------- */
function spawn(e){
  for(let t=0;t<400;t++){
    const ang=Math.random()*6.283,rr=Math.sqrt(Math.random())*Math.max(1,RAD-3),x=Math.round(N/2+Math.cos(ang)*rr-1),y=Math.round(N/2+Math.sin(ang)*rr-1);
    let ok=true;
    for(let j=-1;j<=3&&ok;j++)for(let i=-1;i<=3;i++){const a=x+i,b=y+j;if(!inC(a,b)||own[idx(a,b)]||trl[idx(a,b)]){ok=false;break}}
    if(ok){for(let j=0;j<3;j++)for(let i=0;i<3;i++)own[idx(x+i,y+j)]=e.id;
      e.x=x+1;e.y=y+1;e.px=e.x;e.py=e.y;const d=[[1,0],[-1,0],[0,1],[0,-1]][Math.floor(Math.random()*4)];e.dx=d[0];e.dy=d[1];e.hx=e.x;e.hy=e.y;e.trail=[];e.alive=true;e.limit=6+Math.floor(Math.random()*10);heads[e.id-1].visible=true;return true}
  }
  return false;
}
function kill(e){
  if(!e.alive)return;e.alive=false;heads[e.id-1].visible=false;
  for(const c of e.trail)trl[c]=0;e.trail=[];
  for(let i=0;i<own.length;i++)if(own[i]===e.id)own[i]=0;
  if(e.human){sfx(300,.5,'sawtooth',.2,-250);gameOver()}else{sfx(200,.15,'square',.08,-100);e.respawn=25}
}
function fill(e){if(e.human){sfx(520,.12,'triangle',.18,300);setTimeout(()=>sfx(780,.15,'triangle',.18),90)}
  for(const c of e.trail){own[c]=e.id;trl[c]=0}
  e.trail=[];
  const out=new Uint8Array(N*N),st=[];
  const push=(x,y)=>{if(x<0||y<0||x>=N||y>=N)return;const i=idx(x,y);if(out[i]||own[i]===e.id)return;out[i]=1;st.push(i)};
  for(let i=0;i<N*N;i++)if(!inC(i%N,(i/N)|0))push(i%N,(i/N)|0);
  while(st.length){const i=st.pop(),x=i%N,y=(i/N)|0;push(x+1,y);push(x-1,y);push(x,y+1);push(x,y-1)}
  for(let i=0;i<N*N;i++)if(!out[i]&&own[i]!==e.id){
    own[i]=e.id;
    if(trl[i]){const o=ents.find(q=>q.id===trl[i]);trl[i]=0;if(o&&o!==e)o.cut=true}
  }
}
function botAI(e){
  const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  const safe=d=>{const x=e.x+d[0],y=e.y+d[1];return inC(x,y)&&trl[idx(x,y)]!==e.id&&!(d[0]===-e.dx&&d[1]===-e.dy)};
  let want=[e.dx,e.dy];
  if(e.trail.length>e.limit){
    const dx=e.hx-e.x,dy=e.hy-e.y;
    want=Math.abs(dx)>Math.abs(dy)?[Math.sign(dx),0]:[0,Math.sign(dy)];
    if(!want[0]&&!want[1])want=[e.dx,e.dy];
  }else if(Math.random()<0.12)want=dirs[Math.floor(Math.random()*4)];
  if(safe(want)){e.dx=want[0];e.dy=want[1];return}
  if(safe([e.dx,e.dy]))return;
  const opts=dirs.filter(safe);
  if(opts.length){const d=opts[Math.floor(Math.random()*opts.length)];e.dx=d[0];e.dy=d[1]}
}
function step(){
  if(!running)return;
  lastTick=performance.now();
  for(const e of ents){
    if(!e.alive){if(!e.human&&--e.respawn<=0)spawn(e);continue}
    e.px=e.x;e.py=e.y;
    if(!e.human&&Math.random()>(e.mv==null?1:e.mv))continue;if(e.human){if(e.nd){e.dx=e.nd[0];e.dy=e.nd[1];e.nd=null}}else botAI(e);
    e.x+=e.dx;e.y+=e.dy;
    if(!inC(e.x,e.y)){e.x-=e.dx;e.y-=e.dy;const o=[[e.dy,e.dx],[-e.dy,-e.dx]].filter(d=>inC(e.x+d[0],e.y+d[1])).sort((a,b)=>Math.hypot(e.x+a[0]-N/2+.5,e.y+a[1]-N/2+.5)-Math.hypot(e.x+b[0]-N/2+.5,e.y+b[1]-N/2+.5));if(!o.length)continue;e.dx=o[0][0];e.dy=o[0][1];e.x+=e.dx;e.y+=e.dy}
    const i=idx(e.x,e.y);
    if(trl[i]===e.id){fill(e);continue}if(trl[i]){const o=ents.find(q=>q.id===trl[i]);if(o){if(o.trail[o.trail.length-1]===i){const rg=z=>{let n=0;for(let k=0;k<N*N;k++)if(own[k]===z.id)n++;return n};if(rg(e)<rg(o))e.cut=true;else o.cut=true}else o.cut=true}}
    if(own[i]===e.id){if(e.trail.length)fill(e)}
    else{e.trail.push(i);trl[i]=e.id}
  }
  for(const e of ents)if(e.cut){e.cut=false;kill(e)}
  refresh();
  const p=ents[0];
  if(p.alive){let n=0;for(let i=0;i<own.length;i++)if(own[i]===1)n++;const pc=Math.round(n*100/CA);sc.textContent=pc+'%';p.pc=pc;if(pc>best){best=pc;bs.textContent=pc+'%'}}
}
function gameOver(){
  running=false;clearInterval(timer);
  try{localStorage.setItem('zrBest',best)}catch(e){}
  document.getElementById('t').textContent=(best>bestAtStart&&(ents[0].pc||0)>0)?'🏆 New Best!':'Game Over';
  {const pc=ents[0].pc||0,secs=Math.round((performance.now()-t0)/1000),two=v=>String(v).padStart(2,'0');
  document.getElementById('m').innerHTML='<span id="big" style="font-size:54px;font-weight:900;color:#2f80ed">0%</span><br>Best: '+best+'% &nbsp;•&nbsp; Time: '+two(Math.floor(secs/60))+':'+two(secs%60)+'<br><small>Phir milte hain! 👋</small>';
  let n=0;const big=document.getElementById('big'),iv=setInterval(()=>{n=Math.min(pc,n+Math.max(1,Math.ceil(pc/20)));big.textContent=n+'%';sfx(300+n*12,.04,'square',.05);if(n>=pc)clearInterval(iv)},40);
  if(best>bestAtStart&&pc>0)setTimeout(()=>{sfx(660,.12,'triangle',.2);setTimeout(()=>sfx(880,.12,'triangle',.2),120);setTimeout(()=>sfx(1100,.25,'triangle',.2),240)},900)}
  document.getElementById('go').textContent='Phir se khelo';
  ov.style.display='flex';
}
function start(){
  if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(actx&&actx.state==='suspended')actx.resume();
  applySkin();sfx(440,.15,'triangle',.15,200);t0=performance.now();bestAtStart=best;
  own=new Uint8Array(N*N);trl=new Uint8Array(N*N);ents=[];
  for(let k=0;k<4;k++){const e={id:k+1,human:k===0,alive:false,trail:[],respawn:0};ents.push(e);spawn(e)}
  ents[0].pc=0;sc.textContent='0%';
  ov.style.display='none';running=true;resize();refresh();lastTick=performance.now();
  clearInterval(timer);timer=setInterval(step,TICK);
}
document.getElementById('go').onclick=start;
/* ---------- render loop ---------- */
const look=new THREE.Vector3(),camPos=new THREE.Vector3();
function loop(){
  requestAnimationFrame(loop);animEnv(performance.now());
  if(ents){
    const t=Math.min(1,(performance.now()-lastTick)/TICK);
    for(const e of ents){
      if(!e.alive)continue;
      const x=e.px+(e.x-e.px)*t-N/2+.5,z=e.py+(e.y-e.py)*t-N/2+.5,g=heads[e.id-1];

#bn{position:absolute;inset:0;z-index:5;display:none;align-items:center;justify-content:center;pointer-events:none;text-align:center;color:#fff;font-size:30px;font-weight:900;text-shadow:0 3px 12px rgba(0,0,0,.7)}
#bn small{display:block;font-size:15px;margin-top:8px}
</style>
<script>
(function(){
if(typeof THREE==='undefined')return;
const $=id=>document.getElementById(id),st=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let level=1;try{level=Math.max(1,+localStorage.getItem('zrLv')||1)}catch(e){}
const target=l=>100;
const diff=l=>{
  if(l<=10)return{n:'EASY',c:'#27ae60',bots:2,mv:.45+l*.025,lim:[4,8],aggr:0};
  if(l<=100)return{n:'MEDIUM',c:'#f2994a',bots:3,mv:.7+(l-10)/90*.25,lim:[6,14],aggr:.1};
  if(l<=300)return{n:'HARD',c:'#eb5757',bots:3,mv:1,lim:[8,18],aggr:.35+(l-100)/200*.35};
  return{n:'HARDCORE',c:'#9b51e0',bots:3,mv:1,lim:[10,26],aggr:1};
};
let D=diff(level);
const radius=l=>l<=10?8+(l-1)*.45:l<=100?13+(l-11)*6/89:l<=300?20+(l-101)*5/199:26+(l-301)*.02;
const clipU={value:RAD};
cells.material.onBeforeCompile=sh=>{
  sh.uniforms.uRad=clipU;
  sh.vertexShader='varying vec3 vW;\n'+sh.vertexShader.replace('#include <begin_vertex>','#include <begin_vertex>\n vW=(modelMatrix*instanceMatrix*vec4(transformed,1.0)).xyz;');
  sh.fragmentShader='uniform float uRad;\nvarying vec3 vW;\n'+sh.fragmentShader.replace('void main() {','void main() {\n if(length(vW.xz)>uRad) discard;');
};
cells.material.customProgramCacheKey=()=>'zrclip';cells.material.needsUpdate=true;
const mask=new THREE.Mesh(new THREE.BufferGeometry(),outer.material);mask.rotation.x=-Math.PI/2;mask.position.y=.65;scene.add(mask);
function applyRadius(){RAD=Math.min(radius(level),N/2-.7);clipU.value=RAD+.3;mask.geometry.dispose();mask.geometry=new THREE.RingGeometry(RAD+.3,RAD+2,72);CA=0;for(let i=0;i<N*N;i++)if(inC(i%N,(i/N)|0))CA++;board.geometry.dispose();board.geometry=new THREE.CylinderGeometry(RAD+.3,RAD+.3,.3,72);if(window.zrRebuild)window.zrRebuild()}
applyRadius();
const lv=document.createElement('div');lv.id='lv';lv.innerHTML='<b id="lvt"></b><div id="lvb"><i id="lvf"></i></div>';wrap.appendChild(lv);
const bn=document.createElement('div');bn.id='bn';wrap.appendChild(bn);
function updHud(){const t=$('lvt');t.textContent='LEVEL '+level+' · '+D.n;t.style.background=D.c}
updHud();
/* bot difficulty */
const _sp=window.spawn;
window.spawn=function(e){const r=_sp(e);if(r&&!e.human){e.mv=D.mv;e.limit=D.lim[0]+Math.floor(Math.random()*(D.lim[1]-D.lim[0]));e.aggr=D.aggr}return r};
const _bot=window.botAI;
window.botAI=function(e){
  _bot(e);
  const p=ents[0];if(!e.aggr||!p.alive||!p.trail.length||Math.random()>e.aggr*.7)return;
  const c=p.trail[p.trail.length>3?p.trail.length-3:0],dx=c%N-e.x,dy=((c/N)|0)-e.y;
  if(Math.abs(dx)+Math.abs(dy)>14)return;
  const w=Math.abs(dx)>Math.abs(dy)?[Math.sign(dx),0]:[0,Math.sign(dy)];
  if((w[0]||w[1])&&!(w[0]===-e.dx&&w[1]===-e.dy)){const x=e.x+w[0],y=e.y+w[1];if(inC(x,y)&&trl[idx(x,y)]!==e.id){e.dx=w[0];e.dy=w[1]}}
};
/* levels */
function startL(){
  if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(actx&&actx.state==='suspended')actx.resume();
  applySkin();sfx(440,.15,'triangle',.15,200);t0=performance.now();bestAtStart=best;
  D=diff(level);applyRadius();own=new Uint8Array(N*N);trl=new Uint8Array(N*N);ents=[];
  for(let k=0;k<4;k++){const e={id:k+1,human:k===0,alive:false,trail:[],respawn:0};ents.push(e);if(k<=D.bots)spawn(e);else{e.respawn=1e9;heads[k].visible=false}}
  ents[0].pc=0;sc.textContent='0% / '+target(level)+'%';$('lvf').style.width='0';updHud();
  ov.style.display='none';bn.style.display='none';running=true;resize();refresh();lastTick=performance.now();
  clearInterval(timer);timer=setInterval(step,TICK);
}
$('go').onclick=startL;
function levelUp(){
  running=false;clearInterval(timer);
  const done=level;level++;D=diff(level);st('zrLv',level);
  sfx(660,.12,'triangle',.2);setTimeout(()=>sfx(880,.12,'triangle',.2),120);setTimeout(()=>sfx(1100,.3,'triangle',.2),240);
  if(navigator.vibrate&&localStorage.getItem('zrVib')!=='0')try{navigator.vibrate([60,40,60,40,120])}catch(e){}
  bn.innerHTML='<div>🎉 Level '+done+' Complete!<small>Next: Level '+level+' · '+D.n+'</small></div>';bn.style.display='flex';updHud();
  setTimeout(()=>{
    const gain=50+done*5;window.zrAddCoins(gain);
    bn.style.pointerEvents='auto';bn.style.background='rgba(0,0,0,.55)';bn.style.overflow='hidden';
    bn.innerHTML='<div style="background:#fff;color:#1d1d1f;padding:22px 30px;border-radius:18px;text-shadow:none;font-size:30px;position:relative;z-index:1"><div style="font-size:56px">🏆</div>VICTORY!<small style="color:#555">Level '+done+' complete</small><div style="color:#d89a00;margin:10px 0">+'+gain+' 🪙</div><button id="vNext">Next Level ▶</button><br><button class="hm" id="vHome" style="margin:10px 0 0">🏠 Home</button></div>';
    for(let i=0;i<30;i++){const c=document.createElement('i');c.className='fc';c.style.cssText='left:'+Math.random()*100+'%;background:'+FCOL[i%5]+';animation-duration:'+(2+Math.random()*2)+'s;animation-delay:-'+Math.random()*2+'s';bn.appendChild(c)}
    const reset=()=>{bn.style.pointerEvents='none';bn.style.background=''};
    $('vNext').onclick=()=>{reset();startL()};
    const dbl=document.createElement('button');dbl.textContent='📺 Ad dekho: coins double (+'+gain+')';dbl.style.cssText='background:#f2b01e;color:#222;margin-bottom:8px;font-size:15px';
    dbl.onclick=()=>window.zrAd(()=>{window.zrAddCoins(gain);dbl.textContent='✅ Doubled! +'+gain;dbl.disabled=true;sfx(880,.15,'triangle',.2)});
    $('vNext').parentNode.insertBefore(dbl,$('vNext'));
    $('vHome').onclick=()=>{reset();bn.style.display='none';$('menu').style.display='block'};
  },900);
}
window.fill=function(e){
  const hum=e.human&&e.trail.length;
  for(const c of e.trail){own[c]=e.id;trl[c]=0}
  e.trail=[];
  const comp=new Int32Array(N*N).fill(-1),sizes=[],stk=[];let nc=0;
  for(let s=0;s<N*N;s++){
    if(comp[s]>=0||own[s]===e.id||!inC(s%N,(s/N)|0))continue;
    let n=0;comp[s]=nc;stk.push(s);
    while(stk.length){const i=stk.pop();n++;const x=i%N,y=(i/N)|0;
      for(const[a,b]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+a,ny=y+b;if(!inC(nx,ny))continue;const j=idx(nx,ny);if(comp[j]>=0||own[j]===e.id)continue;comp[j]=nc;stk.push(j)}}
    sizes.push(n);nc++;
  }
  if(nc>1){
    let big=0;sizes.forEach((v,k)=>{if(v>sizes[big])big=k});
    for(let i=0;i<N*N;i++)if(comp[i]>=0&&comp[i]!==big){own[i]=e.id;if(trl[i]){const o=ents.find(q=>q.id===trl[i]);trl[i]=0;if(o&&o!==e)o.cut=true}}
  }
  if(hum){sfx(520,.12,'triangle',.18,300);setTimeout(()=>sfx(780,.15,'triangle',.18),90);if(navigator.vibrate&&localStorage.getItem('zrVib')!=='0')try{navigator.vibrate(35)}catch(e){}}
};
const _step=window.step;
window.step=function(){
  _step();
  if(!running||!ents||!ents[0].alive)return;
  const tg=target(level),pc=ents[0].pc||0;
  sc.textContent=pc+'% / '+tg+'%';$('lvf').style.width=Math.min(100,pc*100/tg)+'%';
  const cnt=[0,0,0,0,0,0];for(let i=0;i<N*N;i++)cnt[own[i]]++;
  for(const b of ents)if(!b.human&&b.alive&&cnt[b.id]===0)kill(b);
  if(cnt[1]>=CA)levelUp();else if(cnt[2]>=CA||cnt[3]>=CA||cnt[4]>=CA)kill(ents[0]);
};
const cs2=document.createElement('style');cs2.textContent='#coinchip{position:absolute;top:calc(env(safe-area-inset-top,0px) + 64px);left:14px;background:rgba(0,0,0,.5);color:#ffd54f;padding:8px 14px;border-radius:20px;font-weight:800;font-size:16px;pointer-events:auto}';document.head.appendChild(cs2);
const chip=document.createElement('div');chip.id='coinchip';chip.innerHTML='🪙 <b id="cn">0</b>';chip.onclick=()=>document.querySelector('.mini').click();$('menu').appendChild(chip);window.zrAddCoins(0);
const _g=window.gameOver;
window.gameOver=function(){
  _g();
  const pcx=ents[0].pc||0,secx=Math.round((performance.now()-t0)/1000),gx=Math.max(1,Math.min(50+level*4,Math.round(pcx*.4+secx*.1)));
  window.zrAddCoins(gx);
  setTimeout(()=>{const b=document.createElement('button');b.textContent='📺 Ad dekho: coins double (+'+gx+')';b.style.cssText='background:#f2b01e;color:#222;display:block;margin:10px auto 0;font-size:14px;padding:10px 16px';b.onclick=()=>window.zrAd(()=>{window.zrAddCoins(gx);b.textContent='✅ Doubled! +'+gx;b.disabled=true;sfx(880,.15,'triangle',.2)});$('m').appendChild(b)},0);
  $('m').insertAdjacentHTML('beforeend','<div style="color:#d89a00;font-weight:800;font-size:18px;margin-top:8px">+'+gx+' 🪙<br><small style="color:#777;font-weight:400">Zone '+pcx+'% · Time '+secx+'s</small></div>');
  $('m').insertAdjacentHTML('afterbegin','<div style="font-weight:800;margin-bottom:6px;color:'+D.c+'">LEVEL '+level+' · '+D.n+'<br><small>Target: '+target(level)+'% • Dobara try karo!</small></div>');
};
})();
</script>
<style>
.rw{position:relative}
#sdot{position:absolute;top:-2px;right:-2px;width:14px;height:14px;border-radius:50%;background:#e53935;border:2px solid #fff;display:none}
#spin{position:absolute;inset:0;z-index:7;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6)}
#sc2{background:var(--card);color:var(--fg);border-radius:18px;padding:18px;width:min(92%,320px);text-align:center}
#sc2 h2{margin:0 0 6px}
#wh{position:relative;width:240px;height:240px;margin:14px auto 8px}
#wh canvas{width:240px;height:240px;border-radius:50%;box-shadow:0 0 0 6px #ffd54f,0 4px 14px rgba(0,0,0,.4);transition:transform 4s cubic-bezier(.12,.7,.1,1)}
#ptr{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:28px;z-index:2;color:#e53935;text-shadow:0 1px 2px #fff}
#sinfo{min-height:24px;font-weight:800;margin:6px 0}
#adov{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#111;color:#fff;font-size:22px;font-weight:800}
</style>
<script>
/* Ads: jab real ads (H5 Games Ads) approve ho jayein tab ZR_ADS_LIVE=true karo */
window.ZR_ADS_LIVE=false;
(function(){
const $=id=>document.getElementById(id),wrap2=document.getElementById('wrap');
window.zrAd=function(cb){
  if(window.ZR_ADS_LIVE&&window.adBreak){try{adBreak({type:'reward',name:'zr_reward',beforeReward:s=>s(),adViewed:cb,adDismissed:()=>{},adBreakDone:()=>{}})}catch(e){}return}
  const o=document.createElement('div');o.id='adov';let t=3;o.innerHTML='📺 Demo Ad<small id="adt" style="font-weight:400;margin-top:8px">3</small>';wrap2.appendChild(o);
  const iv=setInterval(()=>{t--;const e=$('adt');if(e)e.textContent=t;if(t<=0){clearInterval(iv);o.remove();cb()}},1000);
};
/* daily spin wheel: 1 free + 3 ad spins, roz refresh */
const today=()=>new Date().toLocaleDateString('en-CA'),MAX=4;
const ldS=()=>{try{const o=JSON.parse(localStorage.getItem('zrSpin')||'{}');return o.d===today()?o:{d:today(),n:0}}catch(e){return{d:today(),n:0}}};
const svS=o=>{try{localStorage.setItem('zrSpin',JSON.stringify(o))}catch(e){}};
const PR=[25,50,25,100,40,75,30,250],WT=[20,15,20,8,15,10,10,2],COL=['#2f80ed','#eb5757','#27ae60','#f2994a','#9b51e0','#00bcd4','#e91e8c','#f1c40f'];
let rot=0,busy=false;
const ov2=document.createElement('div');ov2.id='spin';
ov2.innerHTML='<div id="sc2"><h2>🎡 Daily Spin</h2><small id="sh"></small><div id="wh"><span id="ptr">▼</span><canvas id="wc" width="480" height="480"></canvas></div><div id="sinfo"></div><button id="sbtn"></button><br><button class="hm" id="sx" style="margin:10px 0 0">Close</button></div>';
wrap2.appendChild(ov2);
(function(){const c=$('wc'),x=c.getContext('2d'),r=240;x.scale(2,2);const R=120;
  for(let i=0;i<8;i++){const a=(i*45-90)*Math.PI/180;x.beginPath();x.moveTo(R,R);x.arc(R,R,R-2,a,a+Math.PI/4);x.closePath();x.fillStyle=COL[i];x.fill();
    x.save();x.translate(R,R);x.rotate(a+Math.PI/8);x.fillStyle='#fff';x.font='bold 20px sans-serif';x.textAlign='right';x.fillText(PR[i],R-16,7);x.restore()}})();
function refreshUI(){
  const s=ldS(),left=MAX-s.n,b=$('sbtn'),t=new Date(),m=new Date(t.getFullYear(),t.getMonth(),t.getDate()+1)-t;
  $('sh').textContent='Aaj ke spins bache: '+left+' / '+MAX;
  if(left<=0){b.textContent='Kal phir aana · '+Math.floor(m/36e5)+'h '+Math.floor(m%36e5/6e4)+'m';b.disabled=true}
  else{b.disabled=busy;b.textContent=s.n===0?'🎁 SPIN (Free)':'📺 Ad dekho & Spin'}
  const d=$('sdot');if(d)d.style.display=s.n===0?'block':'none';
}
function spin(){
  const s=ldS();s.n++;svS(s);
  let tot=WT.reduce((a,b)=>a+b),q=Math.random()*tot,k=0;for(;k<7;k++){q-=WT[k];if(q<0)break}
  rot=360*Math.ceil(rot/360)+360*5+(360-(k*45+22.5));
  busy=true;$('sinfo').textContent='';$('wc').style.transform='rotate('+rot+'deg)';refreshUI();
  let n=0;const tk=setInterval(()=>{sfx(300+(n++%6)*60,.04,'square',.05)},180);
  setTimeout(()=>{clearInterval(tk);busy=false;window.zrAddCoins(PR[k]);$('sinfo').textContent='🎉 +'+PR[k]+' 🪙';
    sfx(660,.12,'triangle',.2);setTimeout(()=>sfx(990,.25,'triangle',.2),130);
    if(navigator.vibrate&&localStorage.getItem('zrVib')!=='0')try{navigator.vibrate([50,30,80])}catch(e){}
    refreshUI()},4100);
}
$('sbtn').onclick=()=>{if(busy)return;const s=ldS();if(s.n>=MAX)return;if(s.n===0)spin();else window.zrAd(spin)};
$('sx').onclick=()=>{if(!busy)ov2.style.display='none'};
const tr=$('tr'),d=document.createElement('div');d.className='rw';d.innerHTML='<button class="rb">🎡</button><i id="sdot"></i><span>Spin</span>';
d.firstChild.onclick=()=>{ov2.style.display='flex';refreshUI()};tr.appendChild(d);refreshUI();
})();
</script>
